const answers = {};

function renderMistakes() {
  const box = document.getElementById('mistakes');
  let html = '';
  DATA.e12_mistakes.forEach(t => {
    const fam = DATA.families.find(f => f.family===t.family);
    const row = fam.rows.find(r => r.id===t.id);
    html += `<div class="mcard">
      <div><b>${t.family}</b> · 字符 <code>${t.char}</code> · wrong=<code>${t.wrong||fam.wrong}</code>
      · margin <span class="badlabel">${t.margin}</span>
      （同族 ${t.score_correct} &lt; 错族 ${t.score_wrong}）</div>
      <p class="muted">上排=目标族中文 ref；下排左=A 右=B。绿框=同族正确，红框=错族。E12 选了错族。</p>
      <div class="row">` + fam.ref.slice(0,8).map((src,i)=>`<div><img src="${src}"/><div class="muted" style="text-align:center;font-size:11px">${DATA.protocol.ref8[i]}</div></div>`).join('') + `</div>
      <div class="row" style="margin-top:8px">
        <div style="border:2px solid ${row.left_role==='correct'?'#1b7f4a':'#a33'};padding:4px;border-radius:6px"><div class="muted">A ${row.left_role}</div><img src="${row.left}"/></div>
        <div style="border:2px solid ${row.right_role==='correct'?'#1b7f4a':'#a33'};padding:4px;border-radius:6px"><div class="muted">B ${row.right_role}</div><img src="${row.right}"/></div>
      </div>
    </div>`;
  });
  box.innerHTML = html;
}

function render() {
  const main = document.getElementById('main');
  let html = '<h2>完整题本（先选再揭晓）</h2>';
  DATA.families.forEach((fam, fi) => {
    html += `<section class="fam"><h2>${fi+1}. ${fam.family} <span class="muted">vs ${fam.wrong}</span></h2>`;
    html += `<p class="muted">E12 本族探针正确率 ${fam.e12_acc} · 平均 margin ${fam.mean_margin}</p>`;
    html += `<div class="refs">` + fam.ref.map((src,i)=>`<div><img src="${src}" alt=""/><div class="muted" style="text-align:center;font-size:11px">${DATA.protocol.ref8[i]}</div></div>`).join('') + `</div>`;
    fam.rows.forEach(row => {
      html += `<div class="trial" data-id="${row.id}">
        <div><b>字符 ${row.char}</b><span class="tag">${row.bucket}</span></div>
        <div class="pair">
          <div class="opt" data-side="L" onclick="pick('${row.id}','L')"><div class="muted">A</div><img src="${row.left}" alt=""/></div>
          <div class="opt" data-side="R" onclick="pick('${row.id}','R')"><div class="muted">B</div><img src="${row.right}" alt=""/></div>
        </div>
        <button class="btn" onclick="reveal('${row.id}')">揭晓本题</button>
        <div class="score" id="score-${row.id}"></div>
      </div>`;
    });
    html += `</section>`;
  });
  main.innerHTML = html;
}
function pick(id, side) {
  answers[id]=side;
  document.querySelectorAll(`.trial[data-id="${id}"] .opt`).forEach(el=>el.classList.toggle('selected', el.dataset.side===side));
  updateStats();
}
function findRow(id) {
  for (const f of DATA.families) for (const r of f.rows) if (r.id===id) return r;
}
function reveal(id) {
  const row=findRow(id);
  document.querySelectorAll(`.trial[data-id="${id}"] .opt`).forEach(el=>{
    const role=el.dataset.side==='L'?row.left_role:row.right_role;
    el.classList.add(role==='correct'?'reveal-ok':'reveal-bad');
  });
  const human=answers[id];
  const box=document.getElementById('score-'+id);
  box.classList.add('show');
  box.innerHTML=`正确答案：${row.answer_side==='L'?'A':'B'} · E12：${row.e12_pick_side==='L'?'A':'B'}（${row.e12_correct_vs_gt?'对':'错'}）<br/>cos同族=${row.score_correct} · cos错族=${row.score_wrong} · margin=${row.margin}`;
  updateStats();
}
function updateStats() {
  let nH=0,okH=0,nA=0,okA=0;
  for (const id of Object.keys(answers)) {
    const row=findRow(id); if(!row) continue;
    nH++; if(answers[id]===row.answer_side) okH++;
    nA++; if(answers[id]===row.e12_pick_side) okA++;
  }
  document.getElementById('humanAcc').textContent = nH?(okH/nH).toFixed(3)+` (${okH}/${nH})`:'—';
  document.getElementById('agreeAcc').textContent = nA?(okA/nA).toFixed(3)+` (${okA}/${nA})`:'—';
}
renderMistakes();
render();
</script>
