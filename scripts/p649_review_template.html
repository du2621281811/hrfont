<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>p649 · 协议 A ink 审查</title>
<style>
:root{--bg:#eef1f5;--panel:#fff;--line:#d5dbe3;--muted:#5c6570;--warn:#8a4b08;--drop:#8b1a1a;--pass:#1b5e20}
*{box-sizing:border-box} html,body{height:100%;margin:0}
body{font:13px/1.45 system-ui,sans-serif;background:var(--bg);color:#1a1a1a;display:flex;flex-direction:column}
header{flex:0 0 auto;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px}
h1{margin:0;font-size:1.1rem} .meta{color:var(--muted);font-size:12px;margin-top:2px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
input,select,button{padding:5px 9px;border:1px solid var(--line);border-radius:4px;font:inherit;background:#fff}
button.primary{background:#1e3a5f;color:#fff;border-color:#1e3a5f}
.layout{flex:1;min-height:0;display:grid;grid-template-columns:420px 1fr}
aside{background:var(--panel);border-right:1px solid var(--line);overflow:auto}
#fontList{list-style:none;margin:0;padding:0}
#fontList li{padding:8px 10px;border-bottom:1px solid #eef1f5;cursor:pointer}
#fontList li:hover{background:#f5f7fa} #fontList li.active{background:#e8eef5}
#fontList li.group{cursor:default;background:#f3f6fa;padding:6px 10px;font-size:11px;color:#3a4450;font-weight:600;position:sticky;top:0;z-index:1}
#fontList li.group:hover{background:#f3f6fa}
#fontList li.dec-drop{border-left:3px solid var(--drop)}
#fontList li.dec-pass{border-left:3px solid var(--pass)}
#fontList li.dec-rerender{border-left:3px solid #1565c0}
.stem{font-weight:600;font-family:ui-monospace,monospace;font-size:12px}
.sub{color:var(--muted);font-size:11px;margin-top:2px}
main{overflow:auto;padding:14px}
.badge{display:inline-block;padding:1px 6px;border-radius:3px;font-size:11px;margin-left:4px}
.badge.cand{background:#fff3cd;color:var(--warn)} .badge.ok{background:#e8f5e9;color:var(--pass)}
.badge.drop{background:#fdecea;color:var(--drop)} .badge.pass{background:#e8f5e9;color:var(--pass)}
.badge.rerender{background:#e3f2fd;color:#1565c0} .badge.done{background:#e8f5e9;color:var(--pass)}
.badge.todo{background:#fff3cd;color:var(--warn)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;margin-top:6px}
.script-block{margin-top:12px}
.script-block h3{margin:0 0 4px;font-size:12px;color:#3a4450;font-weight:650}
.cell{background:#fff;border:1px solid var(--line);padding:4px;text-align:center}
.cell img{width:64px;height:64px;image-rendering:pixelated;background:#fff}
.cell.miss img{visibility:hidden}
.cell.miss{background:#fff5f5;border-color:#e8b4b4}
.cell.miss .lab::after{content:" 缺文件";color:#b42318}
.cell .lab{font-size:11px;color:var(--muted);margin-top:2px}
.dec{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0;padding:10px;background:#fff;border:1px solid var(--line)}
.note{color:var(--muted);font-size:12px}
.paths{font:12px/1.5 ui-monospace,monospace;background:#fff;border:1px solid var(--line);padding:8px 10px;margin:8px 0}
.progress{display:flex;align-items:center;gap:10px;margin-top:6px}
.bar{flex:1;min-width:160px;height:8px;background:#e6ebf1;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:#2e7d32;width:0}
#progressText{font-size:12px}
.rule{font-size:11px;color:var(--muted);margin-top:4px}
.who{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;padding:8px 10px;background:#f7f9fc;border:1px solid var(--line);border-radius:4px}
.who.missing{background:#fff5f5;border-color:#e8b4b4}
.who .me{font-weight:650}
.owner{font-size:11px;color:var(--muted);margin-left:6px}
</style></head>
<body>
<header>
  <h1>p649 · 协议 A · ink 人工审查（pass / drop / rerender）</h1>
  <div class="meta" id="meta"></div>
  <div class="progress">
    <div class="bar"><i id="progressBar"></i></div>
    <span id="progressText"></span>
    <span id="doneBadge"></span>
  </div>
  <div class="who missing" id="identityBar">
    <span>审查人</span>
    <select id="reviewerPick"><option value="">选择已有姓名…</option></select>
    <input id="reviewerNew" type="text" placeholder="或输入新姓名" style="width:140px" autocomplete="nickname"/>
    <button type="button" class="primary" id="btnUseReviewer">以此身份审查</button>
    <span class="me" id="whoAmI">尚未选择 — 无法写入</span>
  </div>
  <div class="rule">先选审查人再打标。决策立刻写入本机；能连上服务器时再同步到磁盘。中途断网可继续点选，同一浏览器下次打开会接着审并自动补写。换电脑或清站点数据前请先导出 JSONL。他人已判的套改判需确认。</div>
  <div class="toolbar">
    <label>显示 <select id="filter">
      <option value="all" selected>全部字体</option>
      <option value="undecided">未决策</option>
      <option value="mine">仅我审的</option>
      <option value="others">仅他人审的</option>
      <option value="decided">已决策</option>
      <option value="drop">仅 drop</option>
      <option value="pass">仅 pass</option>
      <option value="rerender">仅 rerender</option>
      <option value="candidates">审查候选</option>
      <option value="abs020">mean_bbox &lt; 20%</option>
      <option value="new389">仅新 389</option>
      <option value="overlap260">仅原 260</option>
    </select></label>
    <label>排序 <select id="sort">
      <option value="style" selected>风格分组（字重连着）</option>
      <option value="ink_asc">mean_bbox ↑ 淡→浓</option>
      <option value="ink_desc">mean_bbox ↓ 浓→淡</option>
      <option value="undecided_first">未决策优先，再按风格</option>
      <option value="stem">stem A–Z</option>
      <option value="split">split + 风格</option>
    </select></label>
    <input id="q" type="search" placeholder="搜索 stem / 风格…" style="min-width:180px"/>
    <button type="button" id="btnExport">导出全部 JSONL</button>
    <button type="button" id="btnExportMine">导出我的 JSONL</button>
    <button type="button" id="btnImport">导入 JSONL 接着审</button>
    <input id="fileImport" type="file" accept=".jsonl,.json,.txt" hidden/>
    <button type="button" class="primary" id="btnExportDrop">导出 drop 文件清单</button>
    <button type="button" id="btnRetrySync">重试同步</button>
    <span class="note" id="sync"></span>
    <span class="note" id="stats"></span>
  </div>
</header>
<div class="layout"><aside><ul id="fontList"></ul></aside><main id="main"></main></div>
<script>
const PROBES = PROBES_PLACEHOLDER;
const SCRIPT_PROBES = SCRIPT_PROBES_PLACEHOLDER;
const REL = "REL_PLACEHOLDER";
const LS_KEY = "hrfont_p649_ink_review_v3";
const LS_DATA_KEY = "hrfont_p649_ink_rank";
const DISK = new URLSearchParams(location.search).get("disk") === "test" ? "./decisions.test.json" : "./decisions.json";
let DATA = null;
let decisions = {};
let activeStem = null;
let diskOk = null;
let saveTimer = null;
let dirty = false;
let saveInFlight = false;
let reviewer = "";
let lastStemByReviewer = {};
let knownReviewers = [];
let subsetScope = "all";

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[c]));
}
function normName(s){
  return String(s || "").trim().replace(/\s+/g, " ");
}
function currentReviewer(){
  return normName(reviewer);
}
function recOf(stem){
  return decisions[stem] || {};
}
function ownerOf(stem){
  return normName(recOf(stem).reviewer);
}
function rememberName(name){
  name = normName(name);
  if (!name) return;
  if (!knownReviewers.includes(name)) knownReviewers.push(name);
  knownReviewers.sort((a,b) => a.localeCompare(b, "zh"));
}
function fillReviewerSelect(){
  const sel = document.getElementById("reviewerPick");
  if (!sel) return;
  const cur = currentReviewer();
  const names = knownReviewers.slice();
  sel.innerHTML = `<option value="">选择已有姓名…</option>` +
    names.map(n => `<option value="${esc(n)}" ${n===cur?"selected":""}>${esc(n)}</option>`).join("");
}
function renderIdentity(){
  const who = currentReviewer();
  const bar = document.getElementById("identityBar");
  const label = document.getElementById("whoAmI");
  if (bar) bar.classList.toggle("missing", !who);
  if (label) label.textContent = who ? `当前：${who}（写入与进度都记在此名下）` : "尚未选择 — 无法写入";
  fillReviewerSelect();
}
function setReviewer(name, resume){
  name = normName(name);
  if (!name){
    alert("请输入审查人姓名");
    return false;
  }
  reviewer = name;
  rememberName(name);
  if (resume !== false && lastStemByReviewer[name]) activeStem = lastStemByReviewer[name];
  renderIdentity();
  saveLocal();
  if (DATA) renderList();
  saveDisk();
  return true;
}
function requireReviewer(){
  const name = currentReviewer();
  if (name) return name;
  alert("请先在顶栏选择或输入审查人姓名，再开始打标。");
  const inp = document.getElementById("reviewerNew");
  if (inp) inp.focus();
  return "";
}

function glyphFolder(ch){
  return /[\u4e00-\u9fff]/.test(ch) ? "StyleImage" : "TargetImage";
}
function imgUrl(stem, split, ch){
  const cp = "u" + ch.codePointAt(0).toString(16).toUpperCase().padStart(4,"0");
  return `${REL}/${split}/${glyphFolder(ch)}/${stem}/${stem}+${cp}.png`;
}
function decOf(stem){
  return (decisions[stem]||{}).review_decision || "";
}
function fontDirs(f){
  return {
    target_rel: `${f.split}/TargetImage/${f.stem}`,
    style_rel: `${f.split}/StyleImage/${f.stem}`,
    target_url: `${REL}/${f.split}/TargetImage/${f.stem}`,
    style_url: `${REL}/${f.split}/StyleImage/${f.stem}`,
  };
}
function inSubset(f, scope){
  if (scope === "overlap260") return f.subset === "overlap260";
  if (scope === "new389") return f.subset !== "overlap260";
  return true;
}
function syncSubsetScope(){
  const sel = document.getElementById("filter");
  const mode = sel && sel.value;
  if (mode === "overlap260" || mode === "new389" || mode === "all") subsetScope = mode;
}
function corpusFonts(){
  return (DATA && DATA.fonts || []).filter(f => inSubset(f, subsetScope));
}
function counts(){
  const rows = corpusFonts();
  const n = rows.length;
  const me = currentReviewer();
  let pass=0, drop=0, rerender=0, mine=0, others=0, decidedAny=0;
  for (const f of rows){
    const d = decOf(f.stem);
    if (!d) continue;
    decidedAny++;
    const mineRec = !!(me && ownerOf(f.stem) === me);
    if (mineRec){
      mine++;
      if (d==="pass") pass++;
      else if (d==="drop") drop++;
      else if (d==="rerender") rerender++;
    } else {
      others++;
      if (!me){
        if (d==="pass") pass++;
        else if (d==="drop") drop++;
        else if (d==="rerender") rerender++;
      }
    }
  }
  const decided = me ? mine : decidedAny;
  return {n, pass, drop, rerender, mine, others, decided, undecided: n-decided, done: n>0 && decided===n, me, scope: subsetScope};
}
function mergeDecisions(a, b){
  const out = Object.assign({}, a||{});
  for (const [stem, rec] of Object.entries(b||{})){
    if (!rec || typeof rec !== "object") continue;
    const cur = out[stem];
    if (!cur || (rec.reviewed_at||"") >= (cur.reviewed_at||"")) out[stem] = rec;
  }
  return out;
}
function loadLocalRaw(){
  try {
    const raw = JSON.parse(localStorage.getItem(LS_KEY)||"{}") || {};
    if (raw.reviewer) reviewer = normName(raw.reviewer);
    if (raw.last_stem_by_reviewer && typeof raw.last_stem_by_reviewer === "object"){
      lastStemByReviewer = Object.assign({}, raw.last_stem_by_reviewer);
    }
    if (raw.last_stem && reviewer){
      lastStemByReviewer[reviewer] = lastStemByReviewer[reviewer] || raw.last_stem;
    }
    if (reviewer && lastStemByReviewer[reviewer]) activeStem = lastStemByReviewer[reviewer];
    if (Array.isArray(raw.known_reviewers)) raw.known_reviewers.forEach(rememberName);
    if (reviewer) rememberName(reviewer);
    if (raw.subset_scope === "overlap260" || raw.subset_scope === "new389" || raw.subset_scope === "all"){
      subsetScope = raw.subset_scope;
    }
    if (raw && raw.decisions) return raw.decisions;
    return raw;
  } catch(e){ return {}; }
}
function persistLocal(){
  const who = currentReviewer();
  if (who && activeStem) lastStemByReviewer[who] = activeStem;
  localStorage.setItem(LS_KEY, JSON.stringify({
    reviewer: who,
    known_reviewers: knownReviewers,
    last_stem_by_reviewer: lastStemByReviewer,
    last_stem: activeStem,
    subset_scope: subsetScope,
    decisions,
    saved_at: new Date().toISOString(),
  }));
}
function saveLocal(){
  dirty = true;
  persistLocal();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveDisk, 250);
}
function setSync(text, ok){
  const el = document.getElementById("sync");
  if (!el) return;
  el.textContent = text;
  el.style.color = ok===true ? "#1b5e20" : (ok===false ? "#8b1a1a" : "");
}
async function saveDisk(opts){
  const who = currentReviewer();
  const force = !!(opts && opts.force);
  if (!who && !force){
    setSync("未选审查人，未写入磁盘", false);
    return;
  }
  if (saveInFlight){
    dirty = true;
    return;
  }
  if (who && activeStem) lastStemByReviewer[who] = activeStem;
  persistLocal();
  const now = new Date().toISOString();
  const reviewers = {};
  if (who) reviewers[who] = { last_stem: activeStem || "", updated_at: now };
  const body = JSON.stringify({
    dataset: DATA && DATA.dataset,
    updated_at: now,
    n: Object.keys(decisions).length,
    reviewer: who,
    last_stem: who ? (activeStem || "") : "",
    reviewers,
    decisions,
  });
  saveInFlight = true;
  try {
    const r = await fetch(DISK, {method:"PUT", headers:{"Content-Type":"application/json"}, body});
    diskOk = r.ok;
    const c = Object.keys(decisions).length;
    if (r.ok){
      dirty = false;
      setSync(`${who || "导入"} · 磁盘已同步 ${c} 条 ${new Date().toLocaleTimeString()}`, true);
    } else {
      dirty = true;
      setSync("磁盘写入失败。进度已在本机，连上后点「重试同步」或导出 JSONL", false);
    }
  } catch(e){
    diskOk = false;
    dirty = true;
    setSync("网络中断，进度已记在本机。恢复后会自动同步，也可点「重试同步」", false);
  } finally {
    saveInFlight = false;
  }
}
async function loadRank(){
  try {
    const r = await fetch("./ink_ratio_rank.json", {cache:"no-store"});
    if (!r.ok) throw new Error("rank http "+r.status);
    const j = await r.json();
    try { localStorage.setItem(LS_DATA_KEY, JSON.stringify(j)); } catch (e) {}
    return j;
  } catch (e) {
    try {
      const cached = localStorage.getItem(LS_DATA_KEY);
      if (cached){
        setSync("字表用本机缓存（当前连不上服务器）", false);
        return JSON.parse(cached);
      }
    } catch (e2) {}
    throw e;
  }
}
async function loadDisk(){
  try {
    const r = await fetch(DISK, {cache:"no-store"});
    if (!r.ok) return {decisions:{}, reviewers:{}};
    const j = await r.json();
    const revs = j.reviewers || {};
    for (const [name, rec] of Object.entries(revs)){
      rememberName(name);
      if (rec && rec.last_stem) lastStemByReviewer[name] = lastStemByReviewer[name] || rec.last_stem;
    }
    for (const rec of Object.values(j.decisions || {})){
      if (rec && rec.reviewer) rememberName(rec.reviewer);
    }
    const who = currentReviewer();
    if (who && lastStemByReviewer[who]) activeStem = lastStemByReviewer[who];
    return {decisions: j.decisions || {}, reviewers: revs};
  } catch(e){ return {decisions:{}, reviewers:{}}; }
}
function parseImportText(text){
  text = (text||"").trim();
  if (!text) return {};
  try {
    const j = JSON.parse(text);
    if (j && j.decisions && typeof j.decisions === "object") return j.decisions;
    if (j && j.stem && j.review_decision) return {[j.stem]: j};
    if (j && typeof j === "object" && !Array.isArray(j)){
      const first = Object.values(j)[0];
      if (first && typeof first === "object" && first.review_decision) return j;
    }
  } catch (e) {}
  const out = {};
  for (const line of text.split(/\n+/)){
    if (!line.trim()) continue;
    const rec = JSON.parse(line);
    if (rec.stem) out[rec.stem] = rec;
  }
  return out;
}
function styleOf(f){
  return f.style_key || f.family_key || f.stem;
}
function weightRank(stem){
  const num = stem.match(/_(\d{3,4})[A-Za-z]{1,3}$/);
  if (num) return 1000 + parseInt(num[1], 10);
  const order = ["EL","UL","L","Xi","R","Zhun","M","Zhong","Da","Te","Cu","DB","B","SB","H","EB","UB"];
  const u = stem.toUpperCase();
  for (let i = order.length - 1; i >= 0; i--){
    if (u.endsWith("-"+order[i]) || u.endsWith("_"+order[i])) return i;
  }
  return 50;
}
function styleThenWeight(a, b){
  const sa = styleOf(a), sb = styleOf(b);
  if (sa !== sb) return sa.localeCompare(sb);
  const wa = weightRank(a.stem), wb = weightRank(b.stem);
  if (wa !== wb) return wa - wb;
  return a.stem.localeCompare(b.stem);
}
function sorted(rows){
  const mode = document.getElementById("sort").value;
  const copy = rows.slice();
  const ink = (a,b) => a.mean_ink_ratio - b.mean_ink_ratio || a.stem.localeCompare(b.stem);
  if (mode === "ink_asc") copy.sort(ink);
  else if (mode === "ink_desc") copy.sort((a,b) => b.mean_ink_ratio - a.mean_ink_ratio || a.stem.localeCompare(b.stem));
  else if (mode === "stem") copy.sort((a,b) => a.stem.localeCompare(b.stem));
  else if (mode === "split") copy.sort((a,b) => a.split.localeCompare(b.split) || styleThenWeight(a,b));
  else if (mode === "undecided_first") copy.sort((a,b) => {
    const ua = decOf(a.stem) ? 1 : 0, ub = decOf(b.stem) ? 1 : 0;
    return ua - ub || styleThenWeight(a,b);
  });
  else copy.sort(styleThenWeight);
  return copy;
}
function filtered(){
  const mode = document.getElementById("filter").value;
  const q = document.getElementById("q").value.trim().toLowerCase();
  return sorted(DATA.fonts.filter(f => {
    if (q && !f.stem.toLowerCase().includes(q) && !styleOf(f).toLowerCase().includes(q)) return false;
    const d = decOf(f.stem);
    if (mode === "candidates") return f.review_candidate;
    if (mode === "abs020") return f.mean_ink_ratio < 0.20;
    if (mode === "new389") return f.subset !== "overlap260";
    if (mode === "overlap260") return f.subset === "overlap260";
    if (mode === "undecided") return !d;
    if (mode === "mine") return !!d && ownerOf(f.stem) === currentReviewer() && !!currentReviewer();
    if (mode === "others") return !!d && ownerOf(f.stem) !== currentReviewer();
    if (mode === "decided") return !!d;
    if (mode === "drop") return d === "drop";
    if (mode === "pass") return d === "pass";
    if (mode === "rerender") return d === "rerender";
    return true;
  }));
}
function renderProgress(){
  const c = counts();
  const pct = c.n ? Math.round(100*c.decided/c.n) : 0;
  document.getElementById("progressBar").style.width = pct + "%";
  const scopeLab = c.scope === "overlap260" ? "原260" : (c.scope === "new389" ? "新389" : "全部");
  const whoLab = c.me ? c.me : "全库";
  document.getElementById("progressText").textContent =
    `${whoLab} · ${scopeLab} · 已审 ${c.decided} / ${c.n}（${pct}%） · 我 ${c.mine} · 他人 ${c.others} · pass ${c.pass} · drop ${c.drop} · rerender ${c.rerender} · 未审 ${c.undecided}`;
  document.getElementById("doneBadge").innerHTML = c.done
    ? `<span class="badge done">${c.me ? "我已审完本范围" : "审查完成"}</span>`
    : `<span class="badge todo">未完成</span>`;
  document.getElementById("stats").textContent =
    `列表 ${filtered().length} · 自动候选 ${DATA.summary.n_review_candidates} · <20% ${DATA.summary.n_mean_bbox_lt_020}`;
}
function renderList(){
  const ul = document.getElementById("fontList");
  const rows = filtered();
  renderProgress();
  const sortMode = document.getElementById("sort").value;
  const showGroups = sortMode === "style" || sortMode === "undecided_first" || sortMode === "split";
  const nBy = {};
  for (const f of rows) nBy[styleOf(f)] = (nBy[styleOf(f)]||0)+1;
  const parts = [];
  let lastStyle = null;
  for (const f of rows){
    const sk = styleOf(f);
    if (showGroups && sk !== lastStyle){
      parts.push(`<li class="group">${esc(sk)} · ${nBy[sk]} 套</li>`);
      lastStyle = sk;
    }
    const d = decOf(f.stem);
    const owner = ownerOf(f.stem);
    const cls = [f.review_candidate?"cand":"", d?("dec-"+d):""].join(" ").trim();
    const badge = d
      ? `<span class="badge ${d}">${d}</span>`
      : (f.review_candidate ? `<span class="badge cand">候选</span>` : `<span class="badge ok">ok</span>`);
    const whoBit = owner ? `<span class="owner">${esc(owner)}</span>` : "";
    parts.push(`<li class="${cls}" data-stem="${f.stem}">
      <div class="stem">#${f.rank} ${esc(f.stem)}${badge}${whoBit}</div>
      <div class="sub">${esc(sk)} · ${esc(f.split)} · ${esc(f.subset)} · mean_bbox ${(100*f.mean_ink_ratio).toFixed(1)}%</div>
    </li>`);
  }
  ul.innerHTML = parts.join("");
  ul.querySelectorAll("li[data-stem]").forEach(li => li.onclick = () => showFont(li.dataset.stem));
  const keep = activeStem && rows.some(r => r.stem === activeStem) ? activeStem : (rows[0] && rows[0].stem);
  if (keep) showFont(keep);
  else document.getElementById("main").innerHTML = `<p class="note">当前筛选下没有字体。</p>`;
}
function applyDecision(stem, value){
  const f = DATA.fonts.find(x => x.stem === stem);
  if (!f || !value) return;
  const who = requireReviewer();
  if (!who){
    if (DATA) renderList();
    return;
  }
  const prev = recOf(stem);
  const prevOwner = normName(prev.reviewer);
  if (prev.review_decision && prevOwner && prevOwner !== who){
    if (!confirm(`该套已由 ${prevOwner} 判为 ${prev.review_decision}。确定用 ${who} 改判为 ${value}？`)) return;
  }
  decisions[stem] = {
    review_decision: value,
    reviewer: who,
    reviewed_at: new Date().toISOString(),
    reason: (document.getElementById("reason")||{}).value?.trim() || "",
    mean_ink_ratio: f.mean_ink_ratio,
    split: f.split,
    subset: f.subset,
    ...fontDirs(f),
    n_glyphs: f.n_glyphs,
  };
  const rowsAfter = filtered();
  if (!rowsAfter.some(r => r.stem === stem) && rowsAfter[0]) activeStem = rowsAfter[0].stem;
  else activeStem = stem;
  saveLocal();
  renderList();
}
function showFont(stem){
  const f = DATA.fonts.find(x => x.stem === stem);
  if (!f) return;
  activeStem = stem;
  document.querySelectorAll("#fontList li[data-stem]").forEach(li => li.classList.toggle("active", li.dataset.stem===stem));
  const d = decisions[stem] || {};
  const cur = d.review_decision || "";
  const dirs = fontDirs(f);
  document.getElementById("main").innerHTML = `
    <h2 style="margin:0 0 6px;font-family:ui-monospace,monospace">${f.stem}</h2>
    <div class="note">风格=${f.style_key||f.family_key||"—"} · rank=${f.rank} · split=${f.split} · subset=${f.subset} · fs_A=${f.fs_A} · tall=${f.tall_ch}/${f.max_h} · wide=${f.wide_ch}/${f.max_w} · glyphs=${f.n_glyphs}</div>
    <div class="note">mean_bbox=<b>${(100*f.mean_ink_ratio).toFixed(2)}%</b>
      · p5/p50/p95=${(100*f.ink_ratio_p5).toFixed(1)}/${(100*f.ink_ratio_p50).toFixed(1)}/${(100*f.ink_ratio_p95).toFixed(1)}%
      · fill=${(100*f.mean_ink_pixel_ratio).toFixed(3)}% · touch=${f.touch_edge} · empty=${f.n_empty} · tofu=${f.n_tofu_groups}</div>
    <div class="paths">drop 将导出这两套目录（相对新盘）：<br/>
      ${dirs.target_rel} <a href="${dirs.target_url}/" target="_blank">打开</a> · 295 PNG<br/>
      ${dirs.style_rel} <a href="${dirs.style_url}/" target="_blank">打开</a> · 338 PNG
    </div>
    <div class="note" id="scriptCover">字表：数字 10 · 拉丁 52 · 扩展拉丁 27 · 平假名 83 · 片假名 86 · 注音 37（合计 Target 295）</div>
    <div class="dec">
      <span>决策：</span>
      ${["pass","drop","rerender"].map(v =>
        `<label><input type="radio" name="dec" value="${v}" ${cur===v?"checked":""}/> ${v}</label>`
      ).join("")}
      <input id="reason" placeholder="reason" value="${esc(d.reason||"")}" style="min-width:220px"/>
      <button type="button" id="btnApply">应用</button>
      <span class="note" id="ownerNote">${
        d.reviewer
          ? `上次：${esc(d.reviewer)} · ${esc(d.review_decision||"")} · ${esc(d.reviewed_at||"")}`
          : (currentReviewer() ? `将以 ${esc(currentReviewer())} 写入` : "请先在顶栏选择审查人")
      }</span>
      <span class="note">1=pass 2=drop 3=rerender，j/k 上下套</span>
    </div>
    <div>${SCRIPT_PROBES.map(g => `
      <div class="script-block">
        <h3>${g.label} · 字表 ${g.n} · 探针 ${g.sample.length}</h3>
        <div class="grid">${g.sample.map(ch => {
          const url = imgUrl(stem, f.split, ch);
          return `<div class="cell"><img src="${url}" alt="${ch}" loading="lazy" onerror="this.parentNode.classList.add('miss')"/><div class="lab">${ch}</div></div>`;
        }).join("")}</div>
      </div>`).join("")}</div>
    <p class="note">mean_bbox&lt;20% 为 drop 候选。原盘未改。导出 drop 清单后可用脚本核对 PNG 是否齐全。</p>`;
  document.querySelectorAll('input[name="dec"]').forEach(inp => {
    inp.onchange = () => applyDecision(stem, inp.value);
  });
  document.getElementById("btnApply").onclick = () => {
    const sel = document.querySelector('input[name="dec"]:checked');
    if (!sel) { alert("请选择 pass/drop/rerender"); return; }
    applyDecision(stem, sel.value);
  };
}
function downloadText(name, text){
  const blob = new Blob([text], {type:"text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}
function exportJsonl(mineOnly){
  const me = currentReviewer();
  const rows = DATA.fonts.filter(f => {
    if (!decOf(f.stem)) return false;
    if (mineOnly) return me && ownerOf(f.stem) === me;
    return true;
  });
  if (!rows.length){ alert(mineOnly ? (me ? "你还没有决策" : "请先选择审查人") : "还没有决策"); return; }
  const lines = rows.map(f => JSON.stringify({dataset: DATA.dataset, stem: f.stem, ...decisions[f.stem]}));
  const name = mineOnly
    ? `p649_ink_review_${me}.jsonl`
    : "p649_ink_review_decisions.jsonl";
  downloadText(name, lines.join("\n")+"\n");
}
function exportDrop(){
  const drops = DATA.fonts.filter(f => decOf(f.stem)==="drop");
  if (!drops.length){ alert("还没有 drop"); return; }
  const stems = drops.map(f => f.stem).join("\n")+"\n";
  const recs = drops.map(f => {
    const d = decisions[f.stem];
    const dirs = fontDirs(f);
    return JSON.stringify({
      dataset: DATA.dataset,
      stem: f.stem,
      split: f.split,
      subset: f.subset,
      review_decision: "drop",
      reason: d.reason||"",
      reviewer: d.reviewer||"",
      n_glyphs: f.n_glyphs,
      target_dir: dirs.target_rel,
      style_dir: dirs.style_rel,
    });
  });
  downloadText("p649_drop_stems.txt", stems);
  downloadText("p649_drop_files.jsonl", recs.join("\n")+"\n");
  alert(`已导出 ${drops.length} 套 drop：p649_drop_stems.txt + p649_drop_files.jsonl\n核对本机：python scripts/build_cn2west_p649_proto_a.py check-export --jsonl <该 jsonl>`);
}
async function main(){
  const local = loadLocalRaw();
  const disk = await loadDisk();
  decisions = mergeDecisions(local, disk.decisions || {});
  renderIdentity();
  DATA = await loadRank();
  document.getElementById("meta").textContent =
    `${DATA.dataset} · 自动候选 ${DATA.summary.n_review_candidates} · mean_bbox<20% ${DATA.summary.n_mean_bbox_lt_020} · empty ${DATA.summary.n_empty} · tofu ${DATA.summary.n_tofu}`;
  const filterSel = document.getElementById("filter");
  if (subsetScope === "overlap260" || subsetScope === "new389"){
    filterSel.value = subsetScope;
  }
  filterSel.onchange = () => { syncSubsetScope(); persistLocal(); renderList(); };
  document.getElementById("sort").onchange = renderList;
  document.getElementById("q").oninput = renderList;
  document.getElementById("btnExport").onclick = () => exportJsonl(false);
  document.getElementById("btnExportMine").onclick = () => exportJsonl(true);
  document.getElementById("btnExportDrop").onclick = exportDrop;
  document.getElementById("btnImport").onclick = () => document.getElementById("fileImport").click();
  document.getElementById("btnUseReviewer").onclick = () => {
    const typed = document.getElementById("reviewerNew").value;
    const picked = document.getElementById("reviewerPick").value;
    setReviewer(typed || picked, true);
  };
  document.getElementById("reviewerPick").onchange = () => {
    const v = document.getElementById("reviewerPick").value;
    if (v) setReviewer(v, true);
  };
  document.getElementById("reviewerNew").addEventListener("keydown", ev => {
    if (ev.key === "Enter"){
      ev.preventDefault();
      setReviewer(document.getElementById("reviewerNew").value, true);
    }
  });
  document.getElementById("fileImport").onchange = async (ev) => {
    const file = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!file) return;
    try {
      const extra = parseImportText(await file.text());
      const n0 = Object.keys(decisions).length;
      decisions = mergeDecisions(decisions, extra);
      for (const rec of Object.values(extra)) if (rec && rec.reviewer) rememberName(rec.reviewer);
      renderIdentity();
      saveLocal();
      await saveDisk({force: true});
      renderList();
      alert(`已合并导入：原 ${n0} 条 → 现 ${Object.keys(decisions).length} 条，可继续未决策。`);
    } catch(e){ alert("导入失败：" + e); }
  };
  document.getElementById("btnRetrySync").onclick = () => saveDisk({force: true});
  document.addEventListener("keydown", ev => {
    if (ev.target && ["INPUT","SELECT","TEXTAREA"].includes(ev.target.tagName)) return;
    const rows = filtered();
    const i = rows.findIndex(r => r.stem === activeStem);
    if (ev.key==="1") applyDecision(activeStem, "pass");
    else if (ev.key==="2") applyDecision(activeStem, "drop");
    else if (ev.key==="3") applyDecision(activeStem, "rerender");
    else if ((ev.key==="j" || ev.key==="ArrowDown") && rows[i+1]) { ev.preventDefault(); showFont(rows[i+1].stem); saveLocal(); }
    else if ((ev.key==="k" || ev.key==="ArrowUp") && rows[i-1]) { ev.preventDefault(); showFont(rows[i-1].stem); saveLocal(); }
  });
  window.addEventListener("online", () => { if (dirty) saveDisk({force: true}); });
  window.addEventListener("beforeunload", persistLocal);
  if (currentReviewer()) await saveDisk();
  else setSync("未选审查人，未写入磁盘", false);
  renderList();
}
main();
</script>
