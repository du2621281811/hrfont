schema_version: 1
# PI 2026-09-05 P1: true E1-continue baseline (same 80k, original RSI + 1-shot 9-token).
# Not matched to E2/E2b n-shot; only matched on init/freeze/steps/batch/seed.
experiment:
  id: E1C-FT-CONTINUE-S3407
  stage: A
  variant: cn2west_ft_v2
  note: original E1 forward; do not route through Stage-A n-shot
init:
  checkpoint: runs/E1-FTV2-A-S3407/global_step_100000
  new_layer: null
data:
  protocol: A
  root: data/fontdiffuser-p253-t295-s338-cn2west-v2
  split_manifest: manifests/split_v3_228_16_16.json
  split: [228, 16, 16]
  excluded: [FZXianZTJW]
  image_size: 96
  format: RGB_PNG
  resize: false
  content_font: NotoSansCJK-Regular
  style_pool_size: 338
  es_cache_path: artifacts/e2/es_spatial_e1_100k.pt
  ec_cache_path: artifacts/e2/ec_multiscale_e1_100k.pt
model:
  rsi_source: official
  freeze_encoders: true
  train: [unet, offset_heads]
  encoder_runtime: cache_only
  style_condition: spatial_3x3
  style_tokens: 9
  delta:
    enabled: false
  nshot:
    min_n: 1
    max_n: 1
    train_sampling: uniform_without_replacement
    eval_refs: null  # E1 eval also 1-shot; do not force ref8 here
train:
  seed: 3407
  steps: 80000
  batch_size: 8
  accumulation: 1
  effective_batch: 8
  optimizer: AdamW
  lr: 1.0e-5
  betas: [0.9, 0.999]
  weight_decay: 0.01
  epsilon: 1.0e-8
  scheduler: linear
  warmup_steps: 2000
  mixed_precision: fp16
  max_grad_norm: 1.0
  gradient_checkpointing: false
  ema: false
  cfg_joint_drop: 0.10
  scr: false
loss:
  diffusion_mse: 1.0
  perceptual: 0.01
  offset: 0.5
checkpoint:
  every_steps: 5000
  save_last: true
eval:
  every_steps: 5000
  best_eligible_from_step: 10000
  inference_steps: 20
  guidance_scale: 7.5
  solver: dpm_solver_pp
  order: 2
