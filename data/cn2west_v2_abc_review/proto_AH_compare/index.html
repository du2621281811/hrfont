<h1>A（逻辑框）vs H（墨迹像素框）</h1>
<p class="s">红框 = FreeType/Pillow <code>textbbox</code>（逻辑/轮廓度量框）· 蓝框 = 渲染后非白像素框</p>
<p>同一字体同一字号下，逻辑框通常 ≥ 墨迹框（含 bearing / 空白）。H 用墨迹进 84px 内框，所以字号可以 ≥ A。</p>
